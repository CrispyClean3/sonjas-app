<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kleine Schritte</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --paper:#EDEEE2;
    --paper-2:#E4E5D6;
    --ink:#22322B;
    --ink-soft:#516057;
    --moss:#46695C;
    --moss-dark:#324e43;
    --amber:#D9A441;
    --amber-soft:#F1DDA8;
    --plum:#6E4F5E;
    --line:#D7D3C2;
    --white:#FBFAF4;
    --danger:#A6503F;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Karla', sans-serif;
    min-height:100vh;
  }
  #app{ max-width:760px; margin:0 auto; padding:32px 20px 60px; }

  header.top{ text-align:center; margin-bottom:20px; }
  header.top h1{
    font-family:'Fraunces', serif; font-weight:600; font-size:2.1rem;
    margin:0 0 6px; color:var(--moss-dark); letter-spacing:-0.01em;
  }
  header.top p{ margin:0; color:var(--ink-soft); font-size:0.98rem; }

  .week-strip{ text-align:center; margin-bottom:22px; }
  .week-dots{ display:flex; justify-content:center; gap:10px; margin-bottom:8px; }
  .week-dot{ display:flex; flex-direction:column; align-items:center; gap:5px; }
  .week-dot .wd-label{ font-family:'IBM Plex Mono', monospace; font-size:0.65rem; color:var(--ink-soft); text-transform:uppercase; }
  .week-dot .wd-dot{ width:12px; height:12px; border-radius:50%; background:var(--paper-2); border:1.5px solid var(--line); display:block; }
  .week-dot.checked .wd-dot{ background:var(--amber); border-color:var(--amber); }
  .week-dot.today .wd-dot{ box-shadow:0 0 0 3px var(--paper), 0 0 0 4.5px var(--moss); }
  .week-text{ font-size:0.82rem; color:var(--ink-soft); }

  nav.stones{
    position:relative; display:flex; justify-content:space-between; align-items:flex-end;
    gap:8px; margin:0 0 26px; padding:0 16px;
  }
  nav.stones::before{
    content:""; position:absolute; left:14%; right:14%; top:32px; height:2px;
    background:repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 14px); z-index:0;
  }
  .stone-btn{
    position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:8px;
    background:none; border:none; cursor:pointer; font-family:'Karla', sans-serif; padding:0; flex:1;
  }
  .stone-btn:nth-child(1){ transform:translateY(-6px); }
  .stone-btn:nth-child(2){ transform:translateY(4px); }
  .stone-btn:nth-child(3){ transform:translateY(-4px); }
  .stone{
    width:56px; height:56px; border-radius:52% 48% 44% 56% / 56% 44% 56% 44%;
    background:var(--white); border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:1.3rem; color:var(--ink-soft);
    transition:background .25s ease, border-color .25s ease, color .25s ease, transform .15s ease;
  }
  .stone-btn:hover .stone{ transform:translateY(-2px); }
  .stone-btn.active .stone{ background:var(--amber); border-color:var(--amber); color:var(--moss-dark); }
  .stone-btn span.label{ font-size:0.72rem; color:var(--ink-soft); letter-spacing:0.02em; }
  .stone-btn.active span.label{ color:var(--moss-dark); font-weight:600; }
  .stone-btn:focus-visible .stone{ outline:2px solid var(--moss); outline-offset:2px; }

  main#content{
    background:var(--white); border:1px solid var(--line); border-radius:22px;
    padding:28px 26px; animation:rise .35s ease;
  }
  @media (prefers-reduced-motion: reduce){ main#content{ animation:none; } }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

  h2.section-title{ font-family:'Fraunces', serif; font-weight:500; font-size:1.35rem; margin:0 0 4px; color:var(--moss-dark); }
  p.section-sub{ margin:0 0 22px; color:var(--ink-soft); font-size:0.94rem; }

  textarea, input[type=text], input[type=date]{
    width:100%; font-family:'Karla', sans-serif; font-size:0.98rem; padding:12px 14px;
    border-radius:12px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); resize:vertical;
  }
  textarea:focus, input[type=text]:focus, input[type=date]:focus{
    outline:2px solid var(--moss); outline-offset:1px; border-color:var(--moss);
  }

  button.primary{
    background:var(--moss); color:var(--white); border:none; padding:11px 20px; border-radius:10px;
    font-family:'Karla', sans-serif; font-weight:600; font-size:0.92rem; cursor:pointer; transition:background .2s ease;
  }
  button.primary:hover{ background:var(--moss-dark); }
  button.primary:disabled{ background:#B9C2BC; cursor:not-allowed; }
  button.ghost{
    background:none; border:1.5px solid var(--line); color:var(--ink-soft); padding:10px 18px;
    border-radius:10px; font-family:'Karla', sans-serif; font-size:0.9rem; cursor:pointer;
  }
  button.ghost:hover{ border-color:var(--moss); color:var(--moss-dark); }
  button:focus-visible{ outline:2px solid var(--moss); outline-offset:2px; }
  .row-buttons{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }

  /* Timer */
  .timer-hero{ text-align:center; padding:6px 0 4px; }
  .timer-display{ font-family:'IBM Plex Mono', monospace; font-size:3.6rem; color:var(--moss-dark); letter-spacing:0.02em; font-weight:600; }
  .timer-sub{ color:var(--ink-soft); font-size:0.92rem; margin-top:2px; }
  .preset-row{ display:flex; gap:8px; justify-content:center; margin:20px 0 8px; flex-wrap:wrap; }
  .preset-chip{ padding:7px 13px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); font-size:0.84rem; cursor:pointer; color:var(--ink-soft); }
  .preset-chip.active{ background:var(--amber-soft); border-color:var(--amber); color:var(--ink); font-weight:600; }
  .stepper-row{ display:flex; align-items:center; justify-content:center; gap:16px; margin:6px 0 22px; }
  .stepper-btn{ width:40px; height:40px; border-radius:50%; border:1.5px solid var(--line); background:var(--white); font-size:1.25rem; cursor:pointer; color:var(--moss-dark); line-height:1; }
  .stepper-btn:hover{ border-color:var(--moss); }
  .stepper-value{ font-family:'IBM Plex Mono', monospace; font-size:1.25rem; min-width:70px; text-align:center; }

  /* Task list & checklist */
  .task-item{ display:flex; align-items:flex-start; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); }
  .task-item:last-child{ border-bottom:none; }
  .task-item input[type=checkbox]{ width:19px; height:19px; margin-top:2px; accent-color:var(--moss); cursor:pointer; flex-shrink:0; }
  .task-main{ flex:1; }
  .task-text{ font-size:0.95rem; }
  .task-text.done{ text-decoration:line-through; color:var(--ink-soft); }
  .task-text.priority{ font-weight:700; }
  .priority-badge{
    display:inline-block; background:var(--amber-soft); color:var(--ink); font-size:0.68rem; font-weight:700;
    padding:1px 8px; border-radius:999px; margin-right:6px; vertical-align:middle;
  }
  .task-due{ font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color:var(--ink-soft); margin-top:2px; display:inline-block; }
  .task-due.overdue{ color:var(--danger); font-weight:600; }
  .task-remove{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:0.8rem; text-decoration:underline; flex-shrink:0; align-self:center; }
  .task-remove:hover{ color:var(--danger); }

  .add-task-box{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:18px; }
  .add-task-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .add-task-row input[type=text]{ flex:2; min-width:160px; }
  .add-task-row input[type=date]{ flex:1; min-width:140px; }

  .pick-list{ display:flex; flex-direction:column; gap:6px; margin-bottom:6px; max-height:180px; overflow-y:auto; }
  .pick-item{ display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border:1px solid var(--line); border-radius:10px; font-size:0.9rem; }
  .pick-item button{ background:none; border:none; color:var(--moss-dark); font-weight:600; cursor:pointer; font-size:0.85rem; }

  .point-banner{
    display:flex; align-items:center; gap:10px; background:var(--amber-soft); border:1px solid var(--amber);
    border-radius:14px; padding:13px 16px; margin-bottom:18px; font-size:0.94rem;
  }
  .point-banner .dot{ width:10px; height:10px; border-radius:50%; background:var(--amber); flex-shrink:0; }
  .manual-point-box{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-top:14px; }

  .empty-state{ text-align:center; padding:26px 10px; color:var(--ink-soft); font-size:0.92rem; }

  details.day-entry{
    border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px;
  }
  details.day-entry summary{ cursor:pointer; list-style:none; }
  details.day-entry summary::-webkit-details-marker{ display:none; }
  .day-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .day-date{ font-family:'IBM Plex Mono', monospace; font-size:0.85rem; color:var(--ink); font-weight:600; }
  .day-point{ font-size:0.82rem; color:var(--ink-soft); }
  .day-point.earned{ color:var(--moss-dark); font-weight:600; }
  .day-tasks{ margin-top:10px; font-size:0.88rem; color:var(--ink-soft); }
  .day-tasks .t{ padding:2px 0; }
  .day-notes{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); font-size:0.86rem; color:var(--ink-soft); }
  .day-notes .k{ font-family:'IBM Plex Mono', monospace; font-size:0.68rem; text-transform:uppercase; color:var(--plum); display:block; margin-top:8px; }
  .day-notes .k:first-child{ margin-top:0; }

  footer.disclaimer{ text-align:center; margin-top:26px; font-size:0.78rem; color:var(--ink-soft); line-height:1.5; }

  @media (max-width:480px){
    .stone{ width:46px; height:46px; font-size:1.1rem; }
    header.top h1{ font-size:1.7rem; }
    main#content{ padding:20px 16px; }
    .timer-display{ font-size:2.8rem; }
  }
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <h1>Kleine Schritte</h1>
    <p>Erst durchatmen. Dann der nächste Schritt.</p>
  </header>

  <div id="weekStrip"></div>

  <nav class="stones" id="stonesNav"></nav>

  <main id="content"></main>

  <footer class="disclaimer">
    Kleiner Hinweis: Diese App ist ein Alltagsbegleiter für dich selbst und ersetzt kein Gespräch mit einer Fachperson oder einer Vertrauensperson.
    <div style="margin-top:10px;" id="resetContainer"></div>
  </footer>
</div>

<script>
(function(){

  const TABS = [
    { id:'start', label:'Start', icon:'⏱' },
    { id:'aufgaben', label:'Aufgaben', icon:'✓' },
    { id:'verlauf', label:'Verlauf', icon:'≈' },
  ];

  let state = {
    tasks: [],   // {id, text, dueDate|null, done, doneDate|null, createdAt}
    days: [],    // {date, timerMinutesPlanned, timerStatus, timerStartedAt, reflection|null, taskIds:[], pointEarned, pointType, pointNote}
    activeTab: 'start',
    loading: true,
    timerDraftMinutes: 30,
    reflectionStep: 'feeling',
    reflectionDraft: { feeling:'', verdraengt:null, was_verdraengt:'', warum:'', erster_schritt:'', was_ansteht:'' },
    newTaskText: '', newTaskDue: '',
    newTodayText: '', newTodayDue: '',
    manualPointNote: '',
    showManualPointField: false
  };

  let tickInterval = null;

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function esc(str){ return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function todayKey(){ return new Date().toLocaleDateString('sv-SE'); }
  function fmtDateShort(key){
    const d = new Date(key + 'T00:00:00');
    return d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'numeric'});
  }
  function formatSeconds(s){
    const m = Math.floor(s/60), sec = s%60;
    return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }

  // ---------- storage (browser localStorage – works on any hosting, no Claude account needed) ----------
  function loadAll(){
    try{ const raw = localStorage.getItem('sonja-aufgaben'); state.tasks = raw ? JSON.parse(raw) : []; }
    catch(e){ state.tasks = []; }
    try{ const raw = localStorage.getItem('sonja-tage'); state.days = raw ? JSON.parse(raw) : []; }
    catch(e){ state.days = []; }
    state.loading = false;
    render();
    const d = getToday();
    if(d && d.timerStatus === 'running') startTicking();
  }
  function saveTasks(){
    try{ localStorage.setItem('sonja-aufgaben', JSON.stringify(state.tasks)); }
    catch(e){ console.error('Speichern fehlgeschlagen', e); }
  }
  function saveDays(){
    try{ localStorage.setItem('sonja-tage', JSON.stringify(state.days)); }
    catch(e){ console.error('Speichern fehlgeschlagen', e); }
  }

  // ---------- day helpers ----------
  function getToday(){ return state.days.find(d => d.date === todayKey()); }
  function getOrCreateToday(){
    let d = getToday();
    if(!d){
      d = { date:todayKey(), timerMinutesPlanned:30, timerStatus:'not_started', timerStartedAt:null,
            reflection:null, taskIds:[], pointEarned:false, pointType:null, pointNote:null };
      state.days.push(d);
      saveDays();
    }
    return d;
  }
  function getRemainingSeconds(d){
    return Math.max(0, d.timerMinutesPlanned*60 - Math.floor((Date.now() - d.timerStartedAt)/1000));
  }

  // ---------- timer actions ----------
  function adjustDraftMinutes(delta){
    state.timerDraftMinutes = Math.min(60, Math.max(5, state.timerDraftMinutes + delta));
    render();
  }
  function setDraftMinutes(v){ state.timerDraftMinutes = v; render(); }

  function startTimer(){
    const d = getOrCreateToday();
    if(d.timerStatus !== 'not_started') return;
    d.timerMinutesPlanned = state.timerDraftMinutes;
    d.timerStatus = 'running';
    d.timerStartedAt = Date.now();
    saveDays();
    render();
    startTicking();
  }
  function endTimerEarly(){
    const d = getToday();
    if(!d || d.timerStatus !== 'running') return;
    d.timerStatus = 'ended_unconfirmed';
    saveDays();
    if(tickInterval){ clearInterval(tickInterval); tickInterval = null; }
    render();
  }
  function confirmTimerEnd(){
    const d = getToday();
    if(!d || d.timerStatus !== 'ended_unconfirmed') return;
    d.timerStatus = 'confirmed';
    saveDays();
    render();
  }
  function startTicking(){
    if(tickInterval) clearInterval(tickInterval);
    tickInterval = setInterval(() => {
      const d = getToday();
      if(!d || d.timerStatus !== 'running'){ clearInterval(tickInterval); tickInterval=null; return; }
      const remaining = getRemainingSeconds(d);
      if(remaining <= 0){
        d.timerStatus = 'ended_unconfirmed';
        saveDays();
        clearInterval(tickInterval); tickInterval = null;
        render();
        return;
      }
      const el = document.getElementById('countdownDisplay');
      if(el) el.textContent = formatSeconds(remaining);
    }, 1000);
  }

  // ---------- reflection (branching wizard) ----------
  const REFLECTION_BACK_MAP = { choice:'feeling', ja_details:'choice', was_ansteht:'choice' };

  function computeReflectionButtonEnabled(){
    const dr = state.reflectionDraft;
    const step = state.reflectionStep;
    if(step === 'feeling') return !!dr.feeling.trim();
    if(step === 'ja_details') return !!(dr.was_verdraengt.trim() && dr.warum.trim() && dr.erster_schritt.trim());
    if(step === 'was_ansteht') return !!dr.was_ansteht.trim();
    return true;
  }

  function updateReflectionText(key, v){
    state.reflectionDraft[key] = v;
    const btn = document.getElementById('reflectionActionBtn');
    if(btn) btn.disabled = !computeReflectionButtonEnabled();
  }

  function reflectionNext(){
    if(state.reflectionStep === 'feeling') state.reflectionStep = 'choice';
    render();
  }
  function reflectionBack(){
    state.reflectionStep = REFLECTION_BACK_MAP[state.reflectionStep] || 'feeling';
    render();
  }
  function chooseVerdraengt(val){
    state.reflectionDraft.verdraengt = val;
    state.reflectionStep = (val === 'ja') ? 'ja_details' : 'was_ansteht';
    render();
  }
  function saveReflectionFinal(){
    const d = getToday();
    const dr = state.reflectionDraft;
    d.reflection = {
      feeling: dr.feeling, verdraengt: dr.verdraengt,
      was_verdraengt: dr.was_verdraengt, warum: dr.warum, erster_schritt: dr.erster_schritt,
      was_ansteht: dr.was_ansteht
    };
    if(dr.verdraengt === 'ja' && dr.erster_schritt.trim()){
      const task = { id:uid(), text: dr.erster_schritt.trim(), dueDate:null, done:false, doneDate:null, createdAt:Date.now(), priority:true };
      state.tasks.unshift(task);
      d.taskIds.unshift(task.id);
      saveTasks();
    }
    saveDays();
    state.reflectionDraft = { feeling:'', verdraengt:null, was_verdraengt:'', warum:'', erster_schritt:'', was_ansteht:'' };
    state.reflectionStep = 'feeling';
    render();
  }
  function renderReflectionNotes(refl){
    if(!refl) return '<em>Keine Reflektion an diesem Tag.</em>';
    let html = `<span class="k">Wie fühle ich mich gerade?</span>${esc(refl.feeling || '–')}`;
    html += `<span class="k">Gibt es etwas, das ich gerade verdränge?</span>${refl.verdraengt === 'ja' ? 'Ja' : 'Nein'}`;
    if(refl.verdraengt === 'ja'){
      html += `<span class="k">Was verdränge ich gerade?</span>${esc(refl.was_verdraengt || '–')}`;
      html += `<span class="k">Warum verdränge ich das gerade wirklich?</span>${esc(refl.warum || '–')}`;
      html += `<span class="k">Was kann ich jetzt als ersten Schritt dagegen tun?</span>${esc(refl.erster_schritt || '–')}`;
    } else {
      html += `<span class="k">Was steht heute noch an?</span>${esc(refl.was_ansteht || '–')}`;
    }
    return html;
  }

  // ---------- tasks (backlog) ----------
  function updateNewTaskText(v){ state.newTaskText = v; }
  function updateNewTaskDue(v){ state.newTaskDue = v; }
  function addBacklogTask(){
    const text = state.newTaskText.trim();
    if(!text) return;
    state.tasks.unshift({ id:uid(), text, dueDate: state.newTaskDue || null, done:false, doneDate:null, createdAt:Date.now() });
    state.newTaskText = ''; state.newTaskDue = '';
    saveTasks();
    render();
  }
  function toggleTaskDoneDirect(taskId){
    const t = state.tasks.find(t => t.id === taskId);
    if(!t) return;
    t.done = !t.done;
    t.doneDate = t.done ? todayKey() : null;
    saveTasks();
    checkAutoPoint();
    render();
  }
  function deleteTask(taskId){
    state.tasks = state.tasks.filter(t => t.id !== taskId);
    state.days.forEach(d => { d.taskIds = d.taskIds.filter(id => id !== taskId); });
    saveTasks(); saveDays();
    render();
  }

  // ---------- today's task list ----------
  function updateNewTodayText(v){ state.newTodayText = v; }
  function updateNewTodayDue(v){ state.newTodayDue = v; }
  function addExistingTaskToToday(taskId){
    const d = getToday();
    if(!d.taskIds.includes(taskId)) d.taskIds.push(taskId);
    saveDays();
    render();
  }
  function addNewTaskToToday(){
    const text = state.newTodayText.trim();
    if(!text) return;
    const task = { id:uid(), text, dueDate: state.newTodayDue || null, done:false, doneDate:null, createdAt:Date.now() };
    state.tasks.unshift(task);
    const d = getToday();
    d.taskIds.push(task.id);
    state.newTodayText = ''; state.newTodayDue = '';
    saveTasks(); saveDays();
    render();
  }
  function removeTaskFromToday(taskId){
    const d = getToday();
    d.taskIds = d.taskIds.filter(id => id !== taskId);
    saveDays();
    render();
  }
  function checkAutoPoint(){
    const d = getToday();
    if(!d || d.pointEarned || !d.reflection || d.taskIds.length === 0) return;
    const allDone = d.taskIds.every(id => { const t = state.tasks.find(x => x.id === id); return t && t.done; });
    if(allDone){ d.pointEarned = true; d.pointType = 'aufgaben'; d.pointNote = null; saveDays(); }
  }
  function toggleShowManualPoint(){
    state.showManualPointField = !state.showManualPointField;
    render();
  }
  function updateManualPointNote(v){ state.manualPointNote = v; }
  function submitManualPoint(){
    const d = getToday();
    if(!d || d.pointEarned) return;
    d.pointEarned = true;
    d.pointType = 'manuell';
    d.pointNote = state.manualPointNote.trim();
    saveDays();
    state.manualPointNote = ''; state.showManualPointField = false;
    render();
  }

  function doResetAllData(){
    state.tasks = [];
    state.days = [];
    state.activeTab = 'start';
    state.timerDraftMinutes = 30;
    state.reflectionStep = 'feeling';
    state.reflectionDraft = { feeling:'', verdraengt:null, was_verdraengt:'', warum:'', erster_schritt:'', was_ansteht:'' };
    state.newTaskText=''; state.newTaskDue='';
    state.newTodayText=''; state.newTodayDue='';
    state.manualPointNote=''; state.showManualPointField=false;
    if(tickInterval){ clearInterval(tickInterval); tickInterval=null; }
    saveTasks();
    saveDays();
    renderResetControl();
    render();
  }

  function showResetConfirm(){
    const el = document.getElementById('resetContainer');
    if(!el) return;
    el.innerHTML = `
      <span style="color:var(--ink-soft);">Wirklich alles löschen?</span>
      <button onclick="App.doResetAllData()" style="background:none; border:none; color:var(--danger); font-size:0.76rem; text-decoration:underline; cursor:pointer; font-family:'Karla', sans-serif; margin-left:8px;">Ja, löschen</button>
      <button onclick="App.renderResetControl()" style="background:none; border:none; color:var(--ink-soft); font-size:0.76rem; text-decoration:underline; cursor:pointer; font-family:'Karla', sans-serif; margin-left:8px;">Abbrechen</button>
    `;
  }

  function renderResetControl(){
    const el = document.getElementById('resetContainer');
    if(!el) return;
    el.innerHTML = `<button onclick="App.showResetConfirm()" style="background:none; border:none; color:var(--ink-soft); font-size:0.76rem; text-decoration:underline; cursor:pointer; font-family:'Karla', sans-serif;">Testdaten zurücksetzen</button>`;
  }

  // ---------- nav ----------
  function renderNav(){
    document.getElementById('stonesNav').innerHTML = TABS.map(t => `
      <button class="stone-btn ${state.activeTab===t.id?'active':''}" onclick="App.setTab('${t.id}')">
        <span class="stone">${t.icon}</span>
        <span class="label">${t.label}</span>
      </button>
    `).join('');
  }
  function setTab(id){ state.activeTab = id; render(); }

  function renderWeekStrip(){
    const days = [];
    for(let i=6;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); days.push(d); }
    const pointDates = new Set(state.days.filter(d => d.pointEarned).map(d => d.date));
    const tk = todayKey();
    let streak = 0;
    for(let i=days.length-1;i>=0;i--){
      const key = days[i].toLocaleDateString('sv-SE');
      if(pointDates.has(key)) streak++; else break;
    }
    const dotsHtml = days.map(d => {
      const key = d.toLocaleDateString('sv-SE');
      const isToday = key === tk;
      const checked = pointDates.has(key);
      const label = d.toLocaleDateString('de-DE', {weekday:'narrow'});
      return `<div class="week-dot ${checked?'checked':''} ${isToday?'today':''}" title="${d.toLocaleDateString('de-DE')}">
        <span class="wd-label">${label}</span><span class="wd-dot"></span></div>`;
    }).join('');
    const totalPoints = state.days.filter(d=>d.pointEarned).length;
    const streakText = streak > 0
      ? `🔥 ${streak} Tag${streak===1?'':'e'} in Folge · ${totalPoints} Punkte insgesamt`
      : `${totalPoints} Punkte insgesamt`;
    return `<div class="week-dots">${dotsHtml}</div><div class="week-text">${streakText}</div>`;
  }

  // ---------- Start tab ----------
  function renderStart(){
    const d = getToday();

    if(!d || d.timerStatus === 'not_started'){
      const presets = [15,30,45,60];
      return `
        <h2 class="section-title">Erholungszeit</h2>
        <p class="section-sub">Erst bewusst runterkommen – ohne schlechtes Gewissen. Danach geht's weiter.</p>
        <div class="timer-hero">
          <div class="timer-display">${formatSeconds(state.timerDraftMinutes*60)}</div>
          <div class="timer-sub">eingestellte Dauer</div>
        </div>
        <div class="preset-row">
          ${presets.map(p => `<div class="preset-chip ${state.timerDraftMinutes===p?'active':''}" onclick="App.setDraftMinutes(${p})">${p} Min.</div>`).join('')}
        </div>
        <div class="stepper-row">
          <button class="stepper-btn" onclick="App.adjustDraftMinutes(-5)" aria-label="5 Minuten weniger">–</button>
          <div class="stepper-value">${state.timerDraftMinutes} Min.</div>
          <button class="stepper-btn" onclick="App.adjustDraftMinutes(5)" aria-label="5 Minuten mehr">+</button>
        </div>
        <div class="row-buttons" style="justify-content:center;">
          <button class="primary" onclick="App.startTimer()">Erholungszeit starten</button>
        </div>
      `;
    }

    if(d.timerStatus === 'running'){
      return `
        <h2 class="section-title">Erholungszeit läuft</h2>
        <p class="section-sub">Fernsehen, Essen, Handy – jetzt ist dafür Zeit, ganz ohne Uhr im Kopf.</p>
        <div class="timer-hero">
          <div class="timer-display" id="countdownDisplay">${formatSeconds(getRemainingSeconds(d))}</div>
          <div class="timer-sub">verbleibend</div>
        </div>
        <div class="row-buttons" style="justify-content:center;">
          <button class="ghost" onclick="App.endTimerEarly()">Frühzeitig beenden</button>
        </div>
      `;
    }

    if(d.timerStatus === 'ended_unconfirmed'){
      return `
        <h2 class="section-title">Zeit ist um</h2>
        <p class="section-sub">Wenn du bereit bist, geht's mit einer kurzen Reflektion weiter.</p>
        <div class="row-buttons" style="justify-content:center;">
          <button class="primary" onclick="App.confirmTimerEnd()">Bestätigen</button>
        </div>
      `;
    }

    if(d.timerStatus === 'confirmed' && !d.reflection){
      const dr = state.reflectionDraft;
      const step = state.reflectionStep;
      const enabled = computeReflectionButtonEnabled();
      const lbl = (t) => `<span class="step-label" style="font-family:'IBM Plex Mono', monospace; font-size:0.72rem; letter-spacing:0.08em; color:var(--plum); text-transform:uppercase; margin-bottom:6px; display:block;">${t}</span>`;
      let body = '';

      if(step === 'feeling'){
        body = `
          ${lbl('Wie fühle ich mich gerade?')}
          <textarea rows="2" oninput="App.updateReflectionText('feeling', this.value)">${esc(dr.feeling)}</textarea>
          <div class="row-buttons"><button class="primary" id="reflectionActionBtn" ${enabled?'':'disabled'} onclick="App.reflectionNext()">Weiter</button></div>
        `;
      } else if(step === 'choice'){
        body = `
          ${lbl('Gibt es etwas, das ich gerade verdränge?')}
          <div class="row-buttons">
            <button class="ghost" onclick="App.reflectionBack()">Zurück</button>
            <button class="primary" onclick="App.chooseVerdraengt('ja')">Ja</button>
            <button class="primary" onclick="App.chooseVerdraengt('nein')">Nein</button>
          </div>
        `;
      } else if(step === 'ja_details'){
        body = `
          ${lbl('Was verdränge ich gerade?')}
          <textarea rows="2" oninput="App.updateReflectionText('was_verdraengt', this.value)">${esc(dr.was_verdraengt)}</textarea>
          <div style="height:14px;"></div>
          ${lbl('Warum verdränge ich das gerade wirklich?')}
          <textarea rows="2" oninput="App.updateReflectionText('warum', this.value)">${esc(dr.warum)}</textarea>
          <div style="height:14px;"></div>
          ${lbl('Was kann ich jetzt als ersten Schritt dagegen tun?')}
          <textarea rows="2" oninput="App.updateReflectionText('erster_schritt', this.value)">${esc(dr.erster_schritt)}</textarea>
          <p class="section-sub" style="margin:10px 0 0;">Diese Antwort wird deine priorisierte Aufgabe für heute.</p>
          <div class="row-buttons">
            <button class="ghost" onclick="App.reflectionBack()">Zurück</button>
            <button class="primary" id="reflectionActionBtn" ${enabled?'':'disabled'} onclick="App.saveReflectionFinal()">Speichern</button>
          </div>
        `;
      } else if(step === 'was_ansteht'){
        body = `
          ${lbl('Was steht heute noch an?')}
          <textarea rows="2" oninput="App.updateReflectionText('was_ansteht', this.value)">${esc(dr.was_ansteht)}</textarea>
          <div class="row-buttons">
            <button class="ghost" onclick="App.reflectionBack()">Zurück</button>
            <button class="primary" id="reflectionActionBtn" ${enabled?'':'disabled'} onclick="App.saveReflectionFinal()">Speichern</button>
          </div>
        `;
      }

      return `
        <h2 class="section-title">Kurze Tagesreflektion</h2>
        <p class="section-sub">Ein, zwei Sätze reichen.</p>
        ${body}
      `;
    }

    // reflection done -> today's checklist view
    const todayTasks = d.taskIds.map(id => state.tasks.find(t => t.id === id)).filter(Boolean);
    const openBacklog = state.tasks.filter(t => !t.done && !d.taskIds.includes(t.id));

    let pointHtml = '';
    if(d.pointEarned){
      const label = d.pointType === 'aufgaben'
        ? 'Punkt erhalten – alle Aufgaben für heute geschafft.'
        : `Punkt erhalten – heute stattdessen geschafft: ${esc(d.pointNote || '–')}`;
      pointHtml = `<div class="point-banner"><span class="dot"></span>${label}</div>`;
    } else {
      pointHtml = `
        <div class="row-buttons">
          <button class="ghost" onclick="App.toggleShowManualPoint()">Heute trotzdem Tagespunkt verdient</button>
        </div>
        ${state.showManualPointField ? `
          <div class="manual-point-box">
            <span class="step-label" style="font-family:'IBM Plex Mono', monospace; font-size:0.72rem; letter-spacing:0.08em; color:var(--plum); text-transform:uppercase; margin-bottom:6px; display:block;">Was hast du stattdessen geschafft?</span>
            <textarea rows="2" oninput="App.updateManualPointNote(this.value)">${esc(state.manualPointNote)}</textarea>
            <div class="row-buttons"><button class="primary" onclick="App.submitManualPoint()">Punkt eintragen</button></div>
          </div>
        ` : ''}
      `;
    }

    const checklistHtml = todayTasks.length
      ? todayTasks.map(t => `
        <div class="task-item">
          <input type="checkbox" ${t.done?'checked':''} onchange="App.toggleTaskDoneDirect('${t.id}')">
          <div class="task-main">
            <div class="task-text ${t.done?'done':''} ${t.priority?'priority':''}">${t.priority?'<span class="priority-badge">Priorität</span> ':''}${esc(t.text)}</div>
            ${t.dueDate ? `<span class="task-due ${(!t.done && t.dueDate < todayKey())?'overdue':''}">bis ${fmtDateShort(t.dueDate)}</span>` : ''}
          </div>
          <button class="task-remove" onclick="App.removeTaskFromToday('${t.id}')">entfernen</button>
        </div>
      `).join('')
      : `<div class="empty-state">Noch keine Aufgaben für heute – füg unten welche hinzu.</div>`;

    return `
      <h2 class="section-title">Heute</h2>
      ${pointHtml}
      ${checklistHtml}
      <div class="add-task-box" style="margin-top:18px;">
        ${openBacklog.length ? `
          <span class="step-label" style="font-family:'IBM Plex Mono', monospace; font-size:0.72rem; letter-spacing:0.08em; color:var(--plum); text-transform:uppercase; margin-bottom:6px; display:block;">Aus der Aufgabenliste hinzufügen</span>
          <div class="pick-list">
            ${openBacklog.map(t => `
              <div class="pick-item">
                <span>${esc(t.text)}${t.dueDate ? ` <span class="task-due">(bis ${fmtDateShort(t.dueDate)})</span>` : ''}</span>
                <button onclick="App.addExistingTaskToToday('${t.id}')">+ heute</button>
              </div>
            `).join('')}
          </div>
        ` : ''}
        <span class="step-label" style="font-family:'IBM Plex Mono', monospace; font-size:0.72rem; letter-spacing:0.08em; color:var(--plum); text-transform:uppercase; margin:10px 0 6px; display:block;">Neue Aufgabe für heute</span>
        <div class="add-task-row">
          <input type="text" placeholder="z.B. Stellenanzeige nochmal öffnen" value="${esc(state.newTodayText)}" oninput="App.updateNewTodayText(this.value)">
          <input type="date" value="${state.newTodayDue}" oninput="App.updateNewTodayDue(this.value)">
        </div>
        <div class="row-buttons"><button class="primary" onclick="App.addNewTaskToToday()">Hinzufügen</button></div>
      </div>
    `;
  }

  // ---------- Aufgabenliste tab ----------
  function renderAufgaben(){
    const tk = todayKey();
    const open = state.tasks.filter(t => !t.done).sort((a,b) => {
      if(!a.dueDate) return 1;
      if(!b.dueDate) return -1;
      return a.dueDate.localeCompare(b.dueDate);
    });
    const done = state.tasks.filter(t => t.done).sort((a,b) => (b.doneDate||'').localeCompare(a.doneDate||''));

    const openHtml = open.length
      ? open.map(t => `
        <div class="task-item">
          <input type="checkbox" onchange="App.toggleTaskDoneDirect('${t.id}')">
          <div class="task-main">
            <div class="task-text ${t.priority?'priority':''}">${t.priority?'<span class="priority-badge">Priorität</span> ':''}${esc(t.text)}</div>
            ${t.dueDate ? `<span class="task-due ${t.dueDate < tk ? 'overdue' : ''}">${t.dueDate < tk ? 'überfällig – ' : 'bis '}${fmtDateShort(t.dueDate)}</span>` : ''}
          </div>
          <button class="task-remove" onclick="App.deleteTask('${t.id}')">löschen</button>
        </div>
      `).join('')
      : `<div class="empty-state">Aktuell keine offenen Aufgaben.</div>`;

    const doneHtml = done.length
      ? done.map(t => `
        <div class="task-item">
          <input type="checkbox" checked onchange="App.toggleTaskDoneDirect('${t.id}')">
          <div class="task-main">
            <div class="task-text done">${esc(t.text)}</div>
            <span class="task-due">erledigt am ${fmtDateShort(t.doneDate)}</span>
          </div>
          <button class="task-remove" onclick="App.deleteTask('${t.id}')">löschen</button>
        </div>
      `).join('')
      : `<div class="empty-state">Noch nichts erledigt.</div>`;

    return `
      <h2 class="section-title">Aufgabenliste</h2>
      <p class="section-sub">Der Vorrat – von hier aus wählst du auch die Aufgaben für "Heute" aus.</p>
      <div class="add-task-box">
        <div class="add-task-row">
          <input type="text" placeholder="Neue Aufgabe …" value="${esc(state.newTaskText)}" oninput="App.updateNewTaskText(this.value)">
          <input type="date" value="${state.newTaskDue}" oninput="App.updateNewTaskDue(this.value)">
        </div>
        <div class="row-buttons"><button class="primary" onclick="App.addBacklogTask()">Aufgabe speichern</button></div>
      </div>
      ${openHtml}
      <details style="margin-top:20px;">
        <summary style="cursor:pointer; color:var(--ink-soft); font-size:0.88rem;">Erledigte Aufgaben anzeigen (${done.length})</summary>
        <div style="margin-top:10px;">${doneHtml}</div>
      </details>
    `;
  }

  // ---------- Verlauf tab ----------
  function renderVerlauf(){
    const sorted = [...state.days].sort((a,b) => b.date.localeCompare(a.date));
    if(!sorted.length){
      return `
        <h2 class="section-title">Verlauf</h2>
        <p class="section-sub">Hier sammelt sich Tag für Tag, was erledigt wurde.</p>
        <div class="empty-state">Noch keine Einträge – der erste Tag mit Erholungszeit und Reflektion legt los.</div>
      `;
    }
    const entries = sorted.map(d => {
      const doneTasksThatDay = state.tasks.filter(t => t.done && t.doneDate === d.date);
      const pointLabel = d.pointEarned
        ? (d.pointType === 'aufgaben' ? '✓ Punkt (alle Aufgaben erledigt)' : `✓ Punkt (manuell: ${esc(d.pointNote || '–')})`)
        : 'kein Punkt';
      const tasksHtml = doneTasksThatDay.length
        ? doneTasksThatDay.map(t => `<div class="t">• ${esc(t.text)}</div>`).join('')
        : `<div class="t">Keine Aufgaben an diesem Tag erledigt.</div>`;
      const notesHtml = renderReflectionNotes(d.reflection);

      return `
        <details class="day-entry">
          <summary>
            <div class="day-head">
              <span class="day-date">${fmtDateShort(d.date)}</span>
              <span class="day-point ${d.pointEarned ? 'earned' : ''}">${pointLabel}</span>
            </div>
          </summary>
          <div class="day-tasks">${tasksHtml}</div>
          <div class="day-notes">${notesHtml}</div>
        </details>
      `;
    }).join('');

    return `
      <h2 class="section-title">Verlauf</h2>
      <p class="section-sub">${sorted.filter(d=>d.pointEarned).length} von ${sorted.length} Tagen mit Punkt.</p>
      ${entries}
    `;
  }

  // ---------- master render ----------
  function render(){
    renderNav();
    document.getElementById('weekStrip').innerHTML = renderWeekStrip();
    const content = document.getElementById('content');
    if(state.loading){ content.innerHTML = `<div class="empty-state">Lädt …</div>`; return; }
    let html = '';
    if(state.activeTab === 'start') html = renderStart();
    else if(state.activeTab === 'aufgaben') html = renderAufgaben();
    else if(state.activeTab === 'verlauf') html = renderVerlauf();
    content.innerHTML = html;
  }

  window.App = {
    setTab,
    adjustDraftMinutes, setDraftMinutes, startTimer, endTimerEarly, confirmTimerEnd,
    updateReflectionText, reflectionNext, reflectionBack, chooseVerdraengt, saveReflectionFinal,
    updateNewTaskText, updateNewTaskDue, addBacklogTask, toggleTaskDoneDirect, deleteTask,
    updateNewTodayText, updateNewTodayDue, addExistingTaskToToday, addNewTaskToToday, removeTaskFromToday,
    toggleShowManualPoint, updateManualPointNote, submitManualPoint,
    doResetAllData, showResetConfirm, renderResetControl
  };

  loadAll();
  renderResetControl();
})();
</script>
</body>
</html>
